name: iOS

on:
  pull_request:
    paths:
      - "BetterLectio/**"
      - "BetterLectioTests/**"
      - "BetterLectio.xcodeproj/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "BetterLectio/**"
      - "BetterLectioTests/**"
      - "BetterLectio.xcodeproj/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: >-
          xcodebuild test
          -quiet
          -project BetterLectio.xcodeproj
          -scheme BetterLectio
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO
