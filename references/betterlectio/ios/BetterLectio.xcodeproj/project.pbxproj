			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Copies the committed WXT MV3 build into the appex bundle, preserving the\n# nested chunks/, content-scripts/, assets/ and vendor/ structure that Safari\n# needs. A Copy Bundle Resources folder reference would land it one level too\n# deep, and a synchronized group flattens every nested file into the bundle\n# root -- both break manifest.json.\n#\n# SafariExtensionResources/ deliberately lives OUTSIDE the SafariExtension/\n# synchronized root group; if it lived inside, the group would bundle flattened\n# duplicates of every file alongside this correctly-structured copy.\n#\n# Refresh it with scripts/sync-safari-extension.sh.\nset -eu\n\nSRC=\"${SRCROOT}/SafariExtensionResources\"\nDST=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\n\nif [ ! -f \"${SRC}/manifest.json\" ]; then\n  echo \"error: ${SRC}/manifest.json is missing. Run ./scripts/sync-safari-extension.sh to build and vendor the web extension.\"\n  exit 1\nfi\n\nmkdir -p \"${DST}\"\n\n# Plain rsync without --delete would leave files from a previous extension build\n# stranded in the bundle; --delete would wipe anything else Xcode staged into\n# Contents/Resources. So track exactly what we copied and remove only that.\nLEDGER=\"${DERIVED_FILE_DIR}/bl-synced-web-resources.txt\"\nif [ -f \"${LEDGER}\" ]; then\n  while IFS= read -r rel; do\n    [ -n \"${rel}\" ] && rm -f \"${DST}/${rel}\"\n  done < \"${LEDGER}\"\nfi\n\nrsync -a --exclude='.DS_Store' \"${SRC}/\" \"${DST}/\"\n\nmkdir -p \"${DERIVED_FILE_DIR}\"\n( cd \"${SRC}\" && find . -type f ! -name '.DS_Store' | sed 's|^\\./||' ) > \"${LEDGER}\"\n\n# Drop directories orphaned by the prune above (never DST itself).\nfind \"${DST}\" -mindepth 1 -type d -empty -delete 2>/dev/null || true\n";
		};
