<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BetterLectio · Google Play screenshots</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="panorama" class="panorama" aria-label="BetterLectio Google Play panorama">
      <div class="atmosphere" aria-hidden="true"></div>
      <div class="blue-track" aria-hidden="true"></div>
      <div class="registration-marks" aria-hidden="true"></div>
      <div class="owl-watermark" aria-hidden="true">
        <img src="../branding/betterlectio.svg" alt="" />
      </div>
      <div id="panels" class="panels"></div>
      <div id="devices" class="devices"></div>
      <div class="brand-lockup" aria-label="BetterLectio">
        <img src="../branding/betterlectio.svg" alt="" />
        <span>BetterLectio</span>
      </div>
      <div id="guides" class="guides" aria-hidden="true"></div>
    </main>
    <script src="config.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
