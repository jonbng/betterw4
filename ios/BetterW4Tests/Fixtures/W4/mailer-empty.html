    [I] SYNTHESIZED FIXTURE — THIS IS NOT A CAPTURE OF w4.uwcrcn.no.

    An empty inbox. No `mailer/*` page has ever been captured (docs/spec/parsers.md
    section 7, plan OQ-4), so the empty-state markup below is the Yii 1 convention
    from parsers.md section 0.4 and nothing more:

        <tr><td colspan="N" class="empty"><span class="empty">No results found.</span></td></tr>

    Yii 1.1 emits the `td.empty`; from 1.1.14 on it wraps the text in the inner
    `span.empty`. Both are [I]. Bug B9 is that the Kotlin port only ever checks the
    first of them, so this fixture carries BOTH markers plus the literal text, and
    the tests additionally exercise each marker on its own with inline markup.

    An empty mailbox is a NORMAL state, so the contract this file pins down is:
    zero messages, outcome `.emptyState` (never `.unrecognised`), the header row
    still column-matched, and no throw. "Empty" and "we could not read the page"
    must never be reported to a student as the same thing.

    TESTS WRITTEN AGAINST THIS FILE VERIFY W4MailerParser. THEY DO NOT VERIFY W4.

    Identities follow the fixture sanitizer (plan D-7): nc26abcd / "Alex Andersen".
-->
