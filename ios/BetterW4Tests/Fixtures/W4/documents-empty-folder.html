    renderer emits an empty <ul class="folder-list"> or omits it entirely. This
    file assumes the empty <ul>, which is the Yii/PHP-template-shaped guess.

    Its whole job is to pin down bug B16 (docs/spec/parsers.md section 12): the

    links, which turns every empty folder into a bogus page whose body is the
    surrounding chrome. The parser must return items == [] AND page == nil here.

    Therefore: every assertion made against this file verifies THE PARSER, not
    W4.
-->
